name: Release GUI

# Сборка приложения настроек и публикация релиза.
#   git tag gui-v1.0.0 && git push multi gui-v1.0.0   -> собрать и выложить релиз
#   вкладка Actions -> Run workflow                   -> собрать без релиза (artifact на 90 дней)

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы GITHUB_TOKEN мог создать релиз

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Версия и разрядность обязаны совпадать с requirements.lock:
      # там зафиксированы колёса cp314 / win_amd64, на другом Python
      # установка с --require-hashes упадёт по несовпадению хэша.
      - name: Python 3.14 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Сборка EXE
        shell: pwsh
        run: .\build_gui_exe.ps1 -NoPause

      - name: Упаковка в архив
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME
          } else {
              $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          $zip = "ident_settings_${version}_win64.zip"
          Compress-Archive -Path dist\ident_settings -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Архив: $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) МБ)"

      # Доступно и для ручного запуска без тега (Actions -> run -> Artifacts)
      - name: Артефакт сборки
        uses: actions/upload-artifact@v7
        with:
          name: ident_settings_win64
          path: ${{ env.ZIP }}
          retention-days: 90

      - name: Публикация релиза
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" `
            --title "Настройки IDENT -> Bitrix24 $env:GITHUB_REF_NAME" `
            --generate-notes
