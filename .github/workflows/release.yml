name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Build executable
        shell: pwsh
        run: .\build_gui_exe.ps1 -NoPause

      - name: Package archive
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME
          } else {
              $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          $zip = "ident_settings_${version}_win64.zip"
          Compress-Archive -Path dist\ident_settings -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ident_settings_win64
          path: ${{ env.ZIP }}
          retention-days: 90

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $notes = if (Test-Path RELEASE_NOTES.md) { @("--notes-file", "RELEASE_NOTES.md") } else { @("--notes", "") }
          gh release create $env:GITHUB_REF_NAME $env:ZIP --title "ident-gui $version" @notes
