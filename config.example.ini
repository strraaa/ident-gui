# Конфигурация интеграции Ident-Битрикс24
# Скопируйте этот файл в config.ini и заполните своими параметрами

[Database]
# Параметры подключения к БД Ident (SQL Server)
server = localhost
port = 1433
database = IdentDB
username = ident_user
# Пароль будет зашифрован автоматически при первом запуске
password = your_password_here
# Таймаут подключения в секундах
connection_timeout = 10
# Таймаут выполнения запроса в секундах
query_timeout = 30

[bitrix]
# URL вебхука Битрикс24 (без параметров)
webhook_url = https://your-portal.bitrix24.ru/rest/1/xxxxxxxxxx/
# Токен будет зашифрован автоматически при первом запуске
token = your_webhook_token_here
# Максимальное количество повторных попыток при ошибках API
max_retries = 3
# Задержки между повторами (в секундах): первая, вторая, третья попытка
retry_delays = 30,60,300
# Ограничение запросов в секунду (для соблюдения лимитов API)
rate_limit = 2
# ID пользователя по умолчанию для новых контактов/сделок (опционально)
# Если не указано - ответственным будет владелец вебхука
# Чтобы узнать ID: откройте профиль пользователя в Битрикс24, ID будет в URL
# Пример: https://portal.bitrix24.ru/company/personal/user/123/ - ID = 123
# Оставьте пустым, чтобы не менять ответственного
default_assigned_by_id =

[pipelines]
# ID воронки (CATEGORY_ID) для сделок
deal_category_id = 0

[contact_fields]
# Пользовательские поля контакта
card_number = UF_CRM_1769083788971
parent_name = UF_CRM_1769087537061

[company_fields]
# Пользовательские поля компании (если используются)
# Пример:
# inn = UF_CRM_COMPANY_INN

[deal_fields]
# Пользовательские поля сделки
ident_id = UF_CRM_1769072841035
start_time = UF_CRM_1769008900
end_time = UF_CRM_1769008947
doctor_name = UF_CRM_1769008996
services = UF_CRM_1769009098
status = UF_CRM_1769009157
card_number = UF_CRM_1769083581481
parent_name = UF_CRM_1769087458477
comment = UF_CRM_1769494714842
filial = UF_CRM_FILIAL
armchair = UF_CRM_ARMCHAIR
status_text = UF_CRM_STATUS
treatment_plan = UF_CRM_1769167266723
treatment_plan_hash = UF_CRM_1769167398642
# Дополнительные поля (опционально)
legacy_card_number = UF_CRM_CARD_NUMBER
order_date = UF_CRM_ORDER_DATE
doctor_speciality = UF_CRM_DOCTOR_SPECIALITY

[deal_defaults]
# Стадия по умолчанию, если статус не сопоставлен
default_stage_id = NEW

[deal_stages]
# Сопоставление статусов Ident -> стадии Bitrix24 (формат CSV "Статус:STAGE_ID")
mapping = Запланирован:NEW,Пациент пришел:NEW,В процессе:UC_NO40X0,Завершен:UC_NO40X0,Завершен (счет выдан):WON,Отменен:LOSE
# Финальные стадии
final = WON,LOSE
# Защищённые стадии (нельзя автоизменять)
protected = PREPAYMENT_INVOICE,FINAL_INVOICE,EXECUTING,APOLOGY

[Sync]
# Интервал синхронизации записей в минутах
interval_minutes = 2
# Размер пакета для обработки за один цикл
batch_size = 50
# Глубина начальной синхронизации в днях (при первом запуске)
initial_days = 7
enable_update_existing = True
# ID филиала (1-5), используется для формирования уникальных идентификаторов
filial_id = 1

[Logging]
# Уровень логирования: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO
# Путь к директории с логами
log_dir = logs
# Количество дней хранения логов
rotation_days = 30
# Максимальный размер файла логов в МБ
max_log_size_mb = 20
# Количество резервных файлов при ротации по размеру
max_backup_files = 5
# Маскировать персональные данные в логах (True/False)
mask_personal_data = True

[Queue]
# Включить очередь повторных попыток (True/False)
enabled = True
# Путь к файлу очереди
persistence_file = queue.json
# Максимальный размер очереди
max_size = 1000
# Максимальное количество попыток
max_retry_attempts = 3
# Интервал между повторами в минутах
retry_interval_minutes = 5

[Monitoring]
# Включить веб-интерфейс мониторинга (True/False)
enable_web_interface = True
# Хост веб-сервера
web_host = localhost
# Порт веб-сервера
web_port = 8080
# Включить метрики (True/False)
enable_metrics = True

[Notifications]
# Email для уведомлений администратора
admin_email = admin@example.com
# SMTP сервер для отправки email
smtp_server = smtp.gmail.com
smtp_port = 587
smtp_username = your_email@gmail.com
smtp_password = your_email_password
# Порог ошибок для отправки уведомления (процент за час)
error_threshold_percent = 10
# Минимальное количество ошибок для отправки уведомления
error_threshold_count = 5

[Performance]
# Максимальное время обработки одной записи в секундах
max_processing_time = 2
# Пауза между пакетами в секундах (для снижения нагрузки)
batch_pause = 1
# Количество одновременных подключений к БД
db_pool_size = 1

[Security]
# Ключ шифрования (генерируется автоматически при первом запуске)
encryption_key =
# Минимальная версия TLS для HTTPS соединений
min_tls_version = 1.2
# Проверять SSL сертификаты (True/False)
verify_ssl = True

[Advanced]
# Режим отладки (выводит дополнительную информацию)
debug_mode = False
# Сухой прогон (не отправляет данные в Битрикс24, только логирует)
dry_run = False
# Пропускать валидацию (не рекомендуется для продакшена)
skip_validation = False
